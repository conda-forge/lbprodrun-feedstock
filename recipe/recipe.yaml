schema_version: 1

context:
  name: lbprodrun
  version: "1.12.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a8bd37fce8331545b8d606e5499f33d2a152d93ce0c16abd63b67c67f468bc9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - lb-prod-run = LbProdRun.__main__:app

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - setuptools-scm >=3.4
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.0
    - lbenv
    - pydantic >=1.10
    - typer >=0.4.1
    - packaging
    - pyyaml >=6.0
    - lbcondawrappers

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - LbProdRun
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - lb-prod-run --help

about:
  summary: CLI for running LHCb applications from LHCbDIRAC
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://gitlab.cern.ch/lhcb-core/lbprodrun

extra:
  recipe-maintainers:
    - chrisburr
